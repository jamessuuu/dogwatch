name: resume

# SPEC §5/§12 M5: */30 poller (bounded by the Neon CU-hour math in
# docs/OPERATIONS.md — quiet nights: one wake) + workflow_dispatch, decision
# channel (b) of three: "authenticated by GitHub repo permissions, works
# with no token and no Vercel, usable from the GitHub mobile app."
#
# MUST read state/pending-gates.json first and exit in ~5s touching
# nothing when empty — the fast path lives at TWO layers on purpose: this
# job's own early-exit step (never even installs dependencies) AND
# `dogwatch resume`'s own internal check (SPEC's belt-and-suspenders,
# since workflow_dispatch with real inputs always has a job to do and
# skips straight past this step by construction).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      gateId:
        description: "Gate id to decide (leave empty to just sweep/execute pending decisions)"
        required: false
        type: string
      decision:
        description: "approve or reject — required if gateId is set"
        required: false
        type: choice
        options: [approve, reject]
      reason:
        description: "Decision reason (optional)"
        required: false
        type: string

# One run at a time — a second trigger while one is still working queues
# rather than racing it (sluice's own claim/lease already makes concurrent
# execution safe, SPEC §11.4 scenario 2 proves it, but there is no reason to
# spend two Neon wakes on the same work).
concurrency:
  group: dogwatch-resume
  cancel-in-progress: false

jobs:
  resume:
    # Repo-guarded: never runs on a fork (SPEC's own repo-guard convention
    # for anything that can write — this workflow both decides AND executes).
    if: github.repository == 'jamessuuu/dogwatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: fast path — exit now if there is nothing pending and no explicit decision was given
        id: check
        run: |
          if [ -n "${{ github.event.inputs.gateId }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq '.gates | length' state/pending-gates.json)" = "0" ]; then
            echo "dogwatch resume: state/pending-gates.json is empty. Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # See ci.yml's own comment: sluice is consumed as an unpublished
      # sibling checkout pre-1.0.0-rc.1 (SPEC's sequencing note), never an
      # npm install. Two-step checkout-then-move (see watch.yml's matching
      # comment): actions/checkout@v4 now refuses a `path:` outside
      # GITHUB_WORKSPACE. This step never actually ran in production yet
      # (state/pending-gates.json has been empty every poll since no
      # scheduled watch.yml run ever got far enough to open a gate — see
      # watch.yml's STATUS note) but carried the same latent bug.
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'
        with:
          repository: jamessuuu/sluice
          path: sluice-checkout
      - name: move sluice checkout to the sibling path the workspace link expects
        if: steps.check.outputs.run == 'true'
        run: mv sluice-checkout ../sluice

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.run == 'true'
      - name: install sluice's own devDependencies
        if: steps.check.outputs.run == 'true'
        working-directory: ../sluice
        run: pnpm install --frozen-lockfile

      - name: decide (workflow_dispatch with an explicit gateId only)
        if: steps.check.outputs.run == 'true' && github.event.inputs.gateId != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
        run: |
          pnpm dogwatch gate decide "${{ github.event.inputs.gateId }}" "${{ github.event.inputs.decision }}" \
            --channel workflow_dispatch \
            --actor "${{ github.actor }}" \
            ${{ github.event.inputs.reason != '' && format('--reason "{0}"', github.event.inputs.reason) || '' }}

      - name: resume — sweep timeouts, claim decided gates, execute exactly once, amend
        if: steps.check.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.DOGWATCH_ISSUES_TOKEN }}
        run: pnpm dogwatch resume

      - name: commit any amendment + regenerated state
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "dogwatch[bot]"
          git config user.email "dogwatch[bot]@users.noreply.github.com"
          git add runs/ state/pending-gates.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(resume): gate decision(s) resolved"
          # Retry-with-rebase (SPEC S9's documented residual window): the
          # PREVIOUS step already called sluice's claim.ack() for every gate
          # resolved this run — exactly-once has already happened at the
          # effect layer by the time we get here. This push is the only
          # thing standing between that decision and it being permanently
          # missing from the published record, if a concurrent watch.yml or
          # resume.yml push landed first (non-fast-forward rejection) and
          # this were never retried. Bounded retries with a rebase in
          # between close exactly that race. A runner killed BETWEEN the
          # resume step finishing and this step ever starting — or a
          # rebase that hits a real conflict, not just a race — is the
          # remaining gap this cannot close; see docs/OPERATIONS.md.
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::push failed after $attempt attempts — an amendment recording a decided gate is committed LOCALLY but not pushed. See docs/OPERATIONS.md's crash-after-ack note." >&2
              exit 1
            fi
            echo "push rejected (attempt $attempt/$max_attempts) — pulling + rebasing and retrying"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::git pull --rebase failed (a real conflict, not just a race) — amendment committed locally, not pushed. See docs/OPERATIONS.md's crash-after-ack note." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
          done
