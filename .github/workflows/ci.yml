name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # M4 (SPEC §12): "wire a postgres:17 service container in CI running the
    # same tests" as the pglite suite (packages/dogwatch/src/store/*.test.ts)
    # — this is the real enforcement; store.real.test.ts is gated on
    # DATABASE_URL and stays skipped everywhere this service isn't present.
    # Mirrors sluice/.github/workflows/ci.yml's own postgres service exactly.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dogwatch
          POSTGRES_PASSWORD: dogwatch
          POSTGRES_DB: dogwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dogwatch:dogwatch@localhost:5432/dogwatch_test
    steps:
      # dogwatch depends on the unpublished @jamessuuu/sluice via a
      # filesystem `link:` (SPEC's sequencing note: M0-M3 build against
      # sluice pre-1.0.0-rc.1, no npm version exists yet). CI checks the
      # sibling repo out next to this one — `packages/dogwatch/package.json`
      # resolves `link:../../../sluice/packages/sluice` relative to this
      # checkout, so `sluice` must land as this checkout's OWN sibling
      # directory (`path: ../sluice`, relative to github.workspace) for the
      # link to be the exact same relative path a local clone uses. At
      # publish time this becomes a pinned npm version and this step is
      # deleted (README "Status" section).
      - uses: actions/checkout@v4
        with:
          repository: jamessuuu/sluice
          path: ../sluice
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 clone: the
          # README drift check (below) walks `git log` for every feat(mN)
          # milestone commit, which a shallow clone would silently hide.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # sluice's own devDependencies (just `typescript` + `@types/node` for
      # its `tsc` build — sluice ships zero runtime dependencies by design)
      # aren't installed by the checkout above; `apps/web`'s build compiles
      # sluice with DOGWATCH's own `typescript` binary
      # (`scripts/build-native-deps.mjs`), but type resolution for
      # `@types/node` still walks sluice's own `node_modules` (SPEC's
      # sequencing note: sluice is consumed pre-1.0.0-rc.1, as a sibling
      # checkout, not an npm install).
      - name: install sluice's own devDependencies (for its @types/node)
        working-directory: ../sluice
        run: pnpm install --frozen-lockfile
      - name: install Playwright's chromium (apps/web's e2e:smoke)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: migrate postgres store (CI service — sluice-store-postgres's own migrations + dogwatch_budget)
        run: pnpm --filter dogwatch run db:migrate

      # The five stages (PROGRAM.md D6). Order is the argument:
      # typecheck -> lint -> unit -> e2e:smoke -> eval.
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        # DATABASE_URL (set above) activates store.real.test.ts's real-
        # Postgres suite alongside the always-on pglite suite
        # (store.test.ts) — both run as ordinary `unit`-project tests.
        run: pnpm test
      - name: e2e-smoke
        # SPEC §11.6: Playwright against `next build && next start` (M6 —
        # apps/web's own `e2e:smoke` script builds, starts the built app,
        # and runs the suite; `pnpm build:deps` inside that build compiles
        # dogwatch + sluice first, since apps/web consumes their build
        # output, not their raw TypeScript source — see
        # `apps/web/next.config.ts`).
        run: pnpm e2e:smoke
      - name: eval
        # fixtures/violations/ (one planted record per rubric rule, exact
        # code required) + replay goldens (frozen clock + seeded ids,
        # byte-identical reproduction) — SPEC §11.2/§11.3.
        run: pnpm eval

      # Drift gates (SPEC §11.5): a generated artifact that no longer
      # matches its source is exactly the kind of silent rot this project
      # exists to catch in OTHER repos — it cannot tolerate the same rot in
      # its own.
      - name: schema drift (schemas/run-record.v1.json vs the Zod source of truth)
        run: pnpm schema:check
      - name: render drift (runs/index.json + state/pending-gates.json vs runs/**)
        run: pnpm render:check
      - name: brand drift (apps/web/public/brand vs scripts/brand.mjs)
        run: pnpm brand:check
      - name: diagram drift (apps/web/public/diagram/gate-flow.svg vs scripts/diagram.mjs)
        run: pnpm diagram:check
      - name: README drift (Status block's declared milestone vs the newest feat(mN) commit)
        run: pnpm readme:check

      # SPEC §11.1: every committed record, on every push — findings
      # re-derived from stored evidence must match byte-for-byte, and the
      # cross-run chain.recordHash / audit hash chain must verify. This is
      # what makes every commit to runs/** self-checking, not just at
      # publish time.
      - name: verify every committed run record
        run: pnpm verify --all --rerun-rules
