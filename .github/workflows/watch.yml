name: watch

# SPEC §5/§12 M1: the nightly autonomous run — probe the six targets, derive
# findings, run the advisory LLM (capped, degrades honestly if unconfigured),
# propose actions, open gates, publish the record + index +
# state/pending-gates.json, commit, push, deploy (the `deploy` job below —
# pushing to `main` is NOT a deploy: this project has no Vercel git
# integration, same as agentjames, so a pushed record sat live-404 until
# something ran `vercel deploy` by hand). `workflow_dispatch` exists for a
# manual re-run; `cli/trigger.ts`'s `resolveRunKind()` reads
# `GITHUB_EVENT_NAME` so ONLY a real cron firing of the `schedule` trigger
# below ever produces `kind:"scheduled"` — a manual re-run of this same
# workflow (or a local `dogwatch watch` invocation) honestly publishes
# `kind:"manual"`.
#
# STATUS (2026-08-29): fixed 2026-08-15 (5143aeb). This file fired on schedule
# every night 2026-08-09 through 2026-08-14 and failed each time in 9-12s on the
# actions/checkout@v4 sibling-path guard fixed just above; since 2026-08-15 it
# publishes a `kind:"scheduled"` record per run (one GitHub-side gap on
# 2026-08-27). Live count: runs/index.json. Lesson recorded in CHANGELOG.md.
#
# STATUS (2026-08-29, redeploy gap): every one of those 13 nightly commits
# published a real record that then 404'd live (README.md's Limitations
# section) — the workflow committed and pushed but nothing ever rebuilt the
# site (last CLI deploy: 2026-08-15). The `deploy` job below closes that
# gap, gated on `secrets.VERCEL_TOKEN` existing (it does not yet —
# James-only to add; see README.md's Limitations until it does).
on:
  schedule:
    - cron: "0 15 * * *" # ~01:00 AEST
  workflow_dispatch:

# SPEC §9: "Concurrency group `dogwatch-watch`; two records are legal
# (different runs), duplicate *effects* are not — intent-derived keys make
# the second one a `replayed` no-op." Queue rather than cancel — a run that's
# already probing should finish and publish, not be killed mid-record.
concurrency:
  group: dogwatch-watch
  cancel-in-progress: false

jobs:
  watch:
    # Repo-guarded: never runs on a fork (same convention as resume.yml —
    # this workflow both spends model/API budget and writes to the repo).
    if: github.repository == 'jamessuuu/dogwatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # sluice is consumed as an unpublished sibling checkout pre-1.0.0-rc.1
      # (SPEC's own sequencing note — see ci.yml's matching comment). Must
      # land as THIS checkout's own sibling directory so the `link:`
      # dependency resolves the same way a local clone with both repos
      # checked out side by side does.
      #
      # actions/checkout@v4 now refuses `path:` values outside
      # `GITHUB_WORKSPACE` ("Repository path ... is not under ...") — the
      # same guard ci.yml hit and fixed at 478fcbb (every scheduled run of
      # THIS workflow failed on it, 2026-08-09 through 2026-08-14: six
      # nights straight, ~9-12s each, never reaching the probe step).
      # Checking out inside the workspace and moving it to the true sibling
      # position afterward gets the same on-disk layout without hitting
      # that guard.
      - uses: actions/checkout@v4
        with:
          repository: jamessuuu/sluice
          path: sluice-checkout
      - name: move sluice checkout to the sibling path the workspace link expects
        run: mv sluice-checkout ../sluice

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: install sluice's own devDependencies
        working-directory: ../sluice
        run: pnpm install --frozen-lockfile

      # SPEC §6 exit codes: 0 clean and 1 findings-at/above-the-gate are BOTH
      # a successfully published record — an eventful night is the product
      # working, not a workflow failure. 2 (probe/environment) / 3 (rubric
      # violation) / 4 (usage/config) / 5 (internal) are real failures: stop
      # here, publish nothing, let the job go red.
      - name: probe the six targets, propose/gate findings, publish the record (SPEC S5 steps 1-3)
        id: watch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DOGWATCH_ISSUES_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set +e
          pnpm dogwatch watch
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "1" ]; then
            echo "dogwatch watch exited $code (not 0/clean or 1/findings) — a real failure, nothing to publish."
            exit "$code"
          fi
          exit 0

      - name: regenerate runs/index.json + state/pending-gates.json
        run: pnpm render

      - name: commit + push the published record
        run: |
          git config user.name "dogwatch[bot]"
          git config user.email "dogwatch[bot]@users.noreply.github.com"
          git add runs/ state/pending-gates.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(watch): nightly run published"
          git push

  # Redeploy gap (README.md's Limitations section, CHANGELOG.md): `watch`
  # above commits + pushes the published record to `main`, but this
  # project has no Vercel git
  # integration, so a push alone never rebuilds the live site. Every
  # nightly record from 2026-08-15 through 2026-08-27 published a real
  # `runs/<id>.json` that then 404'd at
  # `https://dogwatch-two.vercel.app/runs/<id>` forever, because the last
  # actual deploy was a one-off manual `vercel --prod` on 2026-08-15. This
  # job closes that gap by running the same CLI deploy `watch` used to rely
  # on a human for, right after a successful record push.
  #
  # `needs: watch` — only after `watch` actually succeeds (SPEC §6: exit 0
  # or 1 are both a successful publish, and the job step already collapses
  # both to a clean job exit — see its own comment above); a job whose
  # `watch` dependency was skipped (fork) or failed is skipped too, same as
  # every other guarded job in this file.
  deploy:
    needs: watch
    if: github.repository == 'jamessuuu/dogwatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Remote build, not `--prebuilt`: `vercel.json`'s own
      # `installCommand`/`buildCommand` (`scripts/vercel-install.sh` clones
      # + builds the unpublished sibling `sluice` checkout on Vercel's OWN
      # build infra, then `pnpm --filter @dogwatch/web build`) already does
      # everything this job would otherwise have to repeat — this step is
      # deliberately just the deploy call, nothing else. `VERCEL_ORG_ID` /
      # `VERCEL_PROJECT_ID` stand in for the (gitignored, never-committed)
      # `.vercel/project.json` the local CLI deploy reads them from — these
      # two IDs are project identifiers, not secrets (Vercel's own CI docs
      # publish them in plain env vars); only the token is.
      #
      # Gated, never a silent fake-pass (James-only to add the secret):
      # `set -euo pipefail` means a REAL deploy failure (bad token, Vercel
      # outage, build error) still fails this job loudly — the early
      # `exit 0` path is the ONLY case that exits clean without deploying,
      # and it says so on stdout every time it takes that path.
      - name: deploy the site to Vercel (prod) — gated on VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_voAD54Kh39C3zNLIexzcCop1
          VERCEL_PROJECT_ID: prj_x0A77CEVtYTDhCudnHbNFcLp1pqB
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "SKIPPED: VERCEL_TOKEN secret not set — site not redeployed; run pages for new records will 404 until it is"
            exit 0
          fi
          npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"
